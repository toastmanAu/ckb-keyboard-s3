[env:ckb-keyboard]
platform = espressif32
board = esp32s3box
framework = arduino
build_flags =
    -DWY_BOARD_LILYGO_TKEYBOARD_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.7
    bblanchon/ArduinoJson@^7.0.0
